name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lastUpdated 需要 git 历史

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # --base 显式指定子路径前缀，GitHub Pages 项目站点必须
      - run: npx vitepress build docs --base /seer-wiki/

      # 补前缀：markdown 里手写的 <a href="/xxx/"> / <img src="/images/...">
      # 不会被 VitePress 自动加 base，这里统一补上，否则线上全 404
      - run: node scripts/fix-base-paths.mjs /seer-wiki/

      # cleanUrls 兼容处理：GitHub Pages 访问 /foo/ 时只找 foo/index.html，
      # 这里把 foo.html 复制一份到 foo/index.html，保证带尾斜杠的链接不 404
      - name: Handle cleanUrls for GitHub Pages
        run: |
          cd docs/.vitepress/dist
          find . -name "*.html" ! -name "index.html" | while read f; do
            dir="${f%.html}"
            mkdir -p "$dir"
            cp "$f" "$dir/index.html"
          done

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
